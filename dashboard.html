<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Dashboard - Eunice Inside Glow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Sidebar -->
        <aside class="fixed inset-y-0 left-0 bg-white shadow-lg max-h-screen w-60">
            <div class="flex flex-col justify-between h-full">
                <div class="flex-grow">
                    <div class="px-4 py-6 text-center border-b">
                        <h1 class="text-xl font-bold leading-none text-gradient">Quiz Dashboard</h1>
                    </div>
                    <div class="p-4">
                        <ul class="space-y-1">
                            <li>
                                <a href="#" class="flex items-center bg-yellow-100 rounded-xl font-bold text-sm text-yellow-900 py-3 px-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="text-lg mr-4" viewBox="0 0 16 16">
                                        <path d="M4 .5a.5.5 0 0 0-1 0V1H2a2 2 0 0 0-2 2v1h16V3a2 2 0 0 0-2-2h-1V.5a.5.5 0 0 0-1 0V1H4V.5zM16 14V5H0v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2zm-3.5-7h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5z"/>
                                    </svg>Overview
                                </a>
                            </li>
                            <li>
                                <a href="#" class="flex bg-white hover:bg-yellow-50 rounded-xl font-bold text-sm text-gray-900 py-3 px-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="text-lg mr-4" viewBox="0 0 16 16">
                                        <path d="M12 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zM5 4h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1zm-.5 2.5A.5.5 0 0 1 5 6h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zM5 8h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1zm0 2h3a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1z"/>
                                    </svg>Responses
                                </a>
                            </li>
                            <li>
                                <a href="#" class="flex bg-white hover:bg-yellow-50 rounded-xl font-bold text-sm text-gray-900 py-3 px-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="text-lg mr-4" viewBox="0 0 16 16">
                                        <path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.826a2 2 0 0 1-1.991-1.819l-.637-7a1.99 1.99 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3zm-8.322.12C1.72 3.042 1.95 3 2.19 3h5.396l-.707-.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981l.006.139z"/>
                                    </svg>Analytics
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="p-4">
                    <button type="button" id="logoutBtn" class="inline-flex items-center justify-center h-9 px-4 rounded-xl bg-gray-900 text-gray-300 hover:text-white text-sm font-semibold transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="" viewBox="0 0 16 16">
                            <path d="M12 1a1 1 0 0 1 1 1v13h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V2a1 1 0 0 1 1-1h8zm-2 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
                        </svg>
                    </button> <span class="font-bold text-sm ml-2">Logout</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="ml-60 pt-16 max-h-screen overflow-auto">
            <div class="px-6 py-8">
                <div class="max-w-4xl mx-auto">
                    <div class="bg-white rounded-3xl p-8 mb-5">
                        <h1 class="text-3xl font-bold mb-8">Dashboard Overview</h1>
                        
                        <!-- Stats Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                            <div class="bg-yellow-50 rounded-xl p-6">
                                <h3 class="text-yellow-900 text-sm font-bold">Total Responses</h3>
                                <p class="text-3xl font-bold" id="totalResponses">0</p>
                            </div>
                            <div class="bg-green-50 rounded-xl p-6">
                                <h3 class="text-green-900 text-sm font-bold">This Week</h3>
                                <p class="text-3xl font-bold" id="weeklyResponses">0</p>
                            </div>
                            <div class="bg-blue-50 rounded-xl p-6">
                                <h3 class="text-blue-900 text-sm font-bold">Conversion Rate</h3>
                                <p class="text-3xl font-bold" id="conversionRate">0%</p>
                            </div>
                            <div class="bg-purple-50 rounded-xl p-6">
                                <h3 class="text-purple-900 text-sm font-bold">Avg. Completion Time</h3>
                                <p class="text-3xl font-bold" id="avgCompletionTime">0m</p>
                            </div>
                        </div>

                        <!-- Charts -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div class="bg-white p-6 rounded-xl shadow">
                                <h4 class="text-xl font-bold mb-4">Response Types Distribution</h4>
                                <canvas id="typesChart"></canvas>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow">
                                <h4 class="text-xl font-bold mb-4">Daily Responses</h4>
                                <canvas id="responsesChart"></canvas>
                            </div>
                        </div>

                        <!-- Recent Responses Table -->
                        <div class="bg-white p-6 rounded-xl shadow">
                            <h4 class="text-xl font-bold mb-4">Recent Responses</h4>
                            <div class="overflow-x-auto">
                                <table class="w-full" id="responsesTable">
                                    <thead>
                                        <tr class="text-left">
                                            <th class="py-3 px-4 border-b">Name</th>
                                            <th class="py-3 px-4 border-b">Email</th>
                                            <th class="py-3 px-4 border-b">Type</th>
                                            <th class="py-3 px-4 border-b">Date</th>
                                            <th class="py-3 px-4 border-b">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Data will be dynamically inserted here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
